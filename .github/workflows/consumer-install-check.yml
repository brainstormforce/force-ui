name: Consumer install check

# Consumers install force-ui as a git dependency. The release tag ships
# package.json without a lockfile, so npm re-resolves every devDependency
# from the registry inside the cloned repo. `npm ci` in the other workflows
# never exercises that path. This job resolves the bare manifest with the
# npm version bundled with Node 18 (npm 9.5.0), which is what broke on
# 2026-09-03 when vitest 5 was published.

on:
    pull_request:
    push:
        branches:
            - master
            - staging

jobs:
    lockless-resolution:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '18.15.0'
            - name: Resolve manifest without lockfile
              run: |
                  echo "npm $(npm -v)"
                  mkdir -p /tmp/consumer-check
                  cp package.json /tmp/consumer-check/
                  cd /tmp/consumer-check
                  npm install --force --package-lock-only --ignore-scripts --no-audit --no-fund \
                    --include=dev --include=peer --include=optional
